[project]
name = "assets"
version = "0.1.0"
description = "A declarative, graph-based asset registry powered by Pydantic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fsspec>=2024.6",
]

[project.optional-dependencies]
s3 = ["fsspec[s3]>=2024.6"]
gcs = ["fsspec[gcs]>=2024.6"]
cloud = ["fsspec[s3,gcs]>=2024.6"]
yaml = ["pyyaml>=6.0"]
transform = ["sqlglot>=25.0", "jinja2>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "ty>=0.0.17",
    "fsspec>=2024.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unused-type-ignore-comment = "error"

[tool.ty.src]
include = ["assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["benchmark: marks tests as benchmarks (deselect with '-m not benchmark')"]
